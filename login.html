<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LawConnect - Login</title>
  <!-- Link to compiled Tailwind CSS -->
  <link href="./dist/output.css" rel="stylesheet">
</head>
<body class="h-screen flex items-center justify-center bg-gray-100">

  <div class="flex w-full max-w-4xl shadow-lg rounded-2xl overflow-hidden bg-white">
    <!-- Left Section -->
    <div class="hidden md:flex w-1/2 bg-blue-900 text-white flex-col justify-center items-center p-8">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-20 h-20 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 3v18m9-9H3" />
      </svg>
      <h1 class="text-3xl font-bold">LawConnect</h1>
      <p class="mt-3 text-center">Connect with trusted lawyers. Book appointments instantly with security & trust.</p>
    </div>

    <!-- Right Section (Form) -->
    <div class="w-full md:w-1/2 p-8">
      <h2 class="text-2xl font-bold text-gray-800 mb-6">Login</h2>
      
      <form class="space-y-4">
        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-gray-700">Email</label>
          <input type="email" placeholder="Enter your email" class="w-full mt-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium text-gray-700">Password</label>
          <input type="password" placeholder="Enter your password" class="w-full mt-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <!-- Role -->
        <div>
          <label class="block text-sm font-medium text-gray-700">Login as</label>
          <select class="w-full mt-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <option value="client">Client</option>
            <option value="lawyer">Lawyer</option>
          </select>
        </div>

        <!-- Button -->
        <button type="submit" class="w-full bg-blue-900 text-white py-2 rounded-lg font-semibold hover:bg-blue-800 transition">
          Login
        </button>
      </form>

      <!-- Links -->
      <div class="mt-4 flex justify-between text-sm">
        <a href="#" class="text-blue-600 hover:underline">Forgot password?</a>
        <a href="#" class="text-blue-600 hover:underline">Create an account</a>
      </div>
    </div>
  </div>

</body>
</html>
